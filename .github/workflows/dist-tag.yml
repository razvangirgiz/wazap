name: Dist tag

# Manual only: point an npm dist-tag of wazap-mcp at a version, or remove it,
# without a release. It uses the same NPM_TOKEN as Publish, because a machine's
# own npm login expires and dist-tags cannot use the OIDC token. `latest` is
# refused: a release moves it, and removing it would break `npm i wazap-mcp`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Dist-tag to change (for example beta or next; never latest)"
        required: true
        type: string
      version:
        description: "Version to point the tag at; leave empty to remove the tag"
        required: false
        type: string

permissions:
  contents: read

jobs:
  dist-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Inputs reach the shell as environment variables, never interpolated
      # into the script, and both are checked before npm sees them.
      - name: Change the dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$TAG" =~ ^[a-z][a-z0-9-]{0,31}$ || "$TAG" == "latest" ]]; then
            echo "::error::Refusing dist-tag '$TAG': lowercase letters, digits and dashes only, and never latest."
            exit 1
          fi
          if [[ -z "$VERSION" ]]; then
            npm dist-tag rm wazap-mcp "$TAG"
          else
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::'$VERSION' is not a version."
              exit 1
            fi
            npm view "wazap-mcp@$VERSION" version >/dev/null
            npm dist-tag add "wazap-mcp@$VERSION" "$TAG"
          fi
          npm dist-tag ls wazap-mcp
