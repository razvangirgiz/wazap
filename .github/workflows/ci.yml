name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so the token cannot either.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # A failure on one Node should still show whether the other passes.
      fail-fast: false
      matrix:
        # 22.16.0 is the oldest Node that package.json's engines accepts (the
        # floor node:sqlite needs); 24 is the newest LTS, the one users
        # installing today get.
        node: ["22.16.0", 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # npm audit reads package-lock.json, not node_modules, so one run without an
  # install covers both Nodes. Only production dependencies: they are what a
  # user's machine runs, and a dev-tool advisory is not a reason to block a PR.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm audit --omit=dev --audit-level=high
