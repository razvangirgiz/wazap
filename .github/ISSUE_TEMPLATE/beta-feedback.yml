name: Beta feedback
description: Report a setup or usage problem in Wazap beta.
title: "[Beta] "
body:
  - type: markdown
    attributes:
      value: "Do not attach credentials, complete logs/status output, phone numbers, message contents or data-directory backups. Redact private details first."
  - type: input
    id: versions
    attributes:
      label: Versions and client
      description: Wazap version, Node version, OS and AI client.
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Step
      options:
        - Installation
        - Phone linking
        - Client or OAuth connection
        - First read
        - Search or pagination
        - Multiple accounts
        - Restart or migration
        - Other usage
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened?
      description: Steps, expected result, actual result and a redacted error code. Include setup time and where you needed help if relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, identifiers and private message contents.
          required: true
